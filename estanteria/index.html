<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <script>
    // Aplicar tema y fuente guardados antes de pintar (evita el destello oscuro).
    try {
      var d = document.documentElement;
      if (localStorage.getItem('mi-biblioteca.tema') === 'claro') { d.dataset.theme = 'claro'; d.style.colorScheme = 'light'; }
      if (localStorage.getItem('mi-biblioteca.fuente') === 'editorial') d.dataset.font = 'editorial';
    } catch (e) {}
  </script>
  <title>Mi Biblioteca · Estantería 3D</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500&family=Libre+Baskerville:wght@400;700&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet" />
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
